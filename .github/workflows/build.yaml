name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Create Android project fresh
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          echo "=== Fix missing cordova files ==="
          mkdir -p android/capacitor-cordova-android-plugins
          echo "ext {}" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          touch android/capacitor-cordova-android-plugins/build.gradle
          ls -la android/capacitor-cordova-android-plugins/
          cat android/app/capacitor.build.gradle
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RbGame-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
