name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Create Android project fresh
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          ls android/app/
          ls android/capacitor-cordova-android-plugins/ || echo "no cordova plugins folder"
          cat android/app/capacitor.build.gradle | head -n 30
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RbGame-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
