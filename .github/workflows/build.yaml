name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Create Android project fresh
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          echo "=== Before fix ==="
          cat android/app/capacitor.build.gradle
          echo "=== Fixing capacitor.build.gradle line 10 ==="
          # Create missing cordova files with valid content
          mkdir -p android/capacitor-cordova-android-plugins/src/main
          echo "ext {}" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          # Restore real build.gradle if we emptied it before
          rm -rf android
          npx cap add android
          npx cap sync android
          echo "ext {}" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          # Patch capacitor.build.gradle to be safe if file missing
          sed -i "s|apply from:.*cordova.variables.gradle|def cordovaVars = new File(rootDir.parentFile.parentFile, 'capacitor-cordova-android-plugins/cordova.variables.gradle')\nif (cordovaVars.exists()) { apply from: cordovaVars.path } else { ext {} }|" android/app/capacitor.build.gradle || true
          cat android/app/capacitor.build.gradle
          ls -la android/capacitor-cordova-android-plugins/
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug --info | tail -n 200
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RbGame-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
